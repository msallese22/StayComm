<mat-button-toggle-group aria-label="Show All...">
  <mat-button-toggle value="clean" (click)="applyFilter('clean')">Clean</mat-button-toggle>
  <mat-button-toggle value="dirty" (click)="applyFilter('dirty')">Dirty</mat-button-toggle>
  <mat-button-toggle-group value="all" (click)="applyFilter('all')">All</mat-button-toggle-group>
</mat-button-toggle-group>
<mat-button-toggle-group aria-label="Show All...">
  <mat-button-toggle value="queen" (click)="applyFilter('queen')">Queen</mat-button-toggle>
  <mat-button-toggle value="king" (click)="applyFilter('king')">King</mat-button-toggle>
  <mat-button-toggle-group value="all" (click)="applyFilter('all')">All</mat-button-toggle-group>
</mat-button-toggle-group>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource">

    <!-- room id -->
    <ng-container matColumnDef="roomId">
      <th mat-header-cell *matHeaderCellDef> Room Number</th>
      <td mat-cell *matCellDef="let row"> {{ row.roomId }}</td>
    </ng-container>

    <!-- current status -->
    <ng-container matColumnDef="roomIsClean">
      <th mat-header-cell *matHeaderCellDef> Current Room Status</th>
      <td mat-cell *matCellDef="let row"> {{ row.roomIsClean }}</td>
    </ng-container>

    <!-- change -->
    <ng-container matColumnDef="changeRoomIsClean">
      <th mat-header-cell *matHeaderCellDef> Change Status</th>
      <td mat-cell *matCellDef="let row">
        <ng-template></ng-template>
      </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

</div>
