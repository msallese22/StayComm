<div class="space-the-buttons">
  <mat-button-toggle-group [formControl]="cleanFilter" (change)="applyFilter($event)" name="room-status"
                           aria-label="Show All...">
    <mat-button-toggle class="status-toggle" value="clean">Clean</mat-button-toggle>
    <mat-button-toggle class="status-toggle" value="dirty">Dirty</mat-button-toggle>
    <mat-button-toggle class="status-toggle" value="all-statuses">All</mat-button-toggle>
  </mat-button-toggle-group>

  <mat-button-toggle-group [formControl]="typeFilter" (change)="applyFilter($event)" name="room-type"
                           aria-label="Show All...">
    <mat-button-toggle class="type-toggle" value="queen">Queen</mat-button-toggle>
    <mat-button-toggle class="status-toggle" value="king">King</mat-button-toggle>
    <mat-button-toggle class="status-toggle" value="all-types">All</mat-button-toggle>
  </mat-button-toggle-group>


  <button mat-button class="save-button" (click)="saveChanges()">Save Changes</button>

</div>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource">

    <!-- room id -->
    <ng-container matColumnDef="roomId">
      <th mat-header-cell *matHeaderCellDef> Room Number</th>
      <td mat-cell *matCellDef="let row"> {{ row.roomId }}</td>
    </ng-container>

    <!-- current status -->
    <ng-container matColumnDef="roomIsClean">
      <th mat-header-cell *matHeaderCellDef> Current Room Status</th>
      <td mat-cell *matCellDef="let row" class="roomIsClean-text">
        @if (row.roomIsClean === true) {
          Clean
        } @else {
          Dirty
        }
      </td>
    </ng-container>

    <!-- change -->
    <ng-container matColumnDef="changeRoomIsClean">
      <th mat-header-cell *matHeaderCellDef>Update Status</th>
      <td mat-cell *matCellDef="let row">
        @if(roomFormType === "change")
        {
          <mat-checkbox [checked]="row.roomIsClean" (change)="updateRoomStatus($event, row.roomId)">
            Clean
          </mat-checkbox>
        } @else if (roomFormType === "block")
        {
          <button mat-button [disabled]="row.roomIsBlocked" (click)="assignStayToRoom(row.roomId)">Assign</button>
        }
      </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

</div>
