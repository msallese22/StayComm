<mat-form-field>
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Guest Last Name or Stay ID" #input>
</mat-form-field>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- guest name column -->
    <ng-container matColumnDef="guestLname">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Guest Name</th>
      <td mat-cell *matCellDef="let row">
        {{ row.guest.guestLname }}, {{ row.guest.guestFname }}
      </td>
    </ng-container>

    <!-- check in date -->
    <ng-container matColumnDef="stayCheckinDate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Check-in Date</th>
      <td mat-cell *matCellDef="let row">
        {{ row.stayCheckinDate }}
      </td>
    </ng-container>

    <!-- check out date -->
    <ng-container matColumnDef="stayCheckoutDate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Check-out Date</th>
      <td mat-cell *matCellDef="let row">
        {{ row.stayCheckoutDate }}
      </td>
    </ng-container>

    <!-- room number -->
    <ng-container matColumnDef="roomId">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Room Number</th>
      <td mat-cell *matCellDef="let row">
        {{ row.room.length > 0 ? row.room[0].roomId : "" }}
      </td>
    </ng-container>

    <!-- stay id -->
    <ng-container matColumnDef="stayId">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Stay ID</th>
      <td mat-cell *matCellDef="let row">
        {{ row.stayId }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)= "navigate(row.stayId)"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No Stays Found{{ input.value }}</td>
    </tr>
  </table>

</div>
