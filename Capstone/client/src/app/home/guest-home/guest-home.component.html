<div class="home-container">
  <div class="welcome">Welcome, {{user.guestFname}} {{user.guestLname}}!</div>
  <div class="square-container">
    <a (click)="newStay()" class="book square-shapes">
      Book a New Stay
    </a>
    <a class="gradient-box square-shapes" (click)="checkedInStaysByGuestId()">
      Your Current Stay
    </a>
    <a class="upcoming square-shapes" (click)="staysByGuestId()">
      Your Stays
    </a>
  </div>
</div>
