<div>
  <div class="new">
    Book a New Stay
  </div>
  <form [formGroup]="newStayForm">
    <div class="top-row">
      <div class="check-in tiny-rectangles">
        <div class="calendar-date">
          <mat-form-field>
            <mat-label>Check In Date</mat-label>
            <input matInput [min]="minDate" [max]="maxDate" [matDatepicker]="checkInPicker"
                   formControlName="checkInDate"/>
            <mat-datepicker-toggle matIconSuffix [for]="checkInPicker"></mat-datepicker-toggle>
            <mat-datepicker #checkInPicker></mat-datepicker>
          </mat-form-field>

        </div>
      </div>
      <div class="check-out tiny-rectangles">
        <div class="calendar-date">
        </div>
        <mat-form-field>
          <mat-label>Check Out Date</mat-label>
          <input matInput [min]="checkOutMinDate" [max]="maxDate" [matDatepicker]="checkOutPicker"
                 formControlName="checkOutDate"/>
          <mat-datepicker-toggle matIconSuffix [for]="checkOutPicker"></mat-datepicker-toggle>
          <mat-datepicker #checkOutPicker></mat-datepicker>
        </mat-form-field>

      </div>
      <div class="guest-info" [formGroup]="guestInfoFormGroup">
        <div class="style-guest-name">
          <mat-form-field appearance="outline">
            <mat-label>Guest First Name</mat-label>
            <input formControlName="guestFirstName" matInput>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Guest Last Name</mat-label>
            <input formControlName="guestLastName" matInput>
          </mat-form-field>
        </div>
        <div class="style-guest-info">
          <mat-form-field appearance="outline">
            <mat-label>Guest Phone Number</mat-label>
            <input formControlName="guestPhone" matInput>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Guest Email Address</mat-label>
            <input formControlName="guestEmail" matInput>
          </mat-form-field>
        </div>
      </div>
    </div>
    <div class="bottom-row">
      <div class="room-type">
        <p>Select A Room Type</p>
        <button mat-raised-button class="king" [disabled]="king===true" (click)="setRoomType('King')">King Suite</button>
        <button mat-raised-button class="queen" [disabled]="king===false" (click)="setRoomType('King')">Queen Suite</button>
        @if(king===true){<p>You've selected a King Suite</p>}
        @else{<p>You've selected a Queen Suite</p>}
        <mat-icon class="info">info</mat-icon>
      </div>
      <div class="rate">
        <p>Confirm Rate</p>
        <div class="rate-ception"><p>$$$</p></div>
        <mat-icon class="material-symbols-outlined info">info</mat-icon>
      </div>
      <div class="credit-card" [formGroup]="creditCardInfoFormGroup">
        <div class="style-credit-card">
        <mat-form-field appearance="outline">
          <mat-label>Credit Card Number:</mat-label>
          <input formControlName="creditCardNumber" matInput placeholder="XXXX-XXXX-XXXX-XXXX">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Exp:</mat-label>
          <input formControlName="creditCardExp" matInput placeholder="MM/YYYY">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>CVV:</mat-label>
          <input formControlName="creditCardCVV" matInput placeholder="XXX or XXXX">
        </mat-form-field>
        </div>
      </div>
    </div>
    <div class="book-container">
      <button mat-raised-button class="book" (click)="openDialog()">Book</button>
    </div>
  </form>
</div>
